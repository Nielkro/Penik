services:
  penik-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: penik-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8143:8143"
    environment:
      - ENV=production
      - PORT=8143
      - DB_PATH=/app/data/messenger.db
      - UPLOAD_DIR=/app/data/upload
      - STICKERS_DIR=/app/data/stickers
      - ALLOWED_ORIGINS=https://your-domain.com
      - LIVEKIT_URL=wss://your-livekit-domain.com
      - LIVEKIT_FALLBACK_URL=wss://your-livekit-fallback.com
      - LIVEKIT_API_KEY=your_livekit_api_key
      - LIVEKIT_API_SECRET=your_livekit_api_secret
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:alpine
    container_name: penik-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - penik-server

volumes:
  caddy_data:
  caddy_config:
