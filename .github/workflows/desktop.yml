name: Build Desktop Client (Windows + Linux)

on:
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - 'client/**'
      - 'version.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force publish desktop release'
        type: boolean
        default: false
        required: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (WebKitGTK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Desktop Binary
        working-directory: desktop
        run: |
          wails build -tags webkit2_41 -platform linux/amd64

      - name: Verify and Package Linux Binary
        run: |
          test -f desktop/build/bin/penik
          mkdir -p release-linux
          cp desktop/build/bin/penik release-linux/penik-linux-amd64
          chmod +x release-linux/penik-linux-amd64
          cd release-linux
          tar -czvf penik-linux-amd64.tar.gz penik-linux-amd64
          sha256sum penik-linux-amd64 penik-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: penik-desktop-linux
          path: release-linux/*
          retention-days: 14

  build-windows:
    name: Build Windows (WebView2)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Desktop Binary
        working-directory: desktop
        run: |
          wails build -platform windows/amd64 -nsis

      - name: Package Windows Artifacts
        shell: bash
        run: |
          mkdir -p release-windows
          if [ -f desktop/build/bin/penik-amd64-installer.exe ]; then
            cp desktop/build/bin/penik-amd64-installer.exe release-windows/penik-setup-windows-amd64.exe
          elif [ -f desktop/build/bin/penik-setup.exe ]; then
            cp desktop/build/bin/penik-setup.exe release-windows/penik-setup-windows-amd64.exe
          fi
          if [ -f desktop/build/bin/penik.exe ]; then
            cp desktop/build/bin/penik.exe release-windows/penik-windows-amd64.exe
          fi
          cd release-windows
          sha256sum * > SHA256SUMS

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: penik-desktop-windows
          path: release-windows/*
          retention-days: 14

  publish-release:
    name: Publish Desktop Releases
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v6
        with:
          name: penik-desktop-linux
          path: dist-release/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v6
        with:
          name: penik-desktop-windows
          path: dist-release/windows

      - name: Publish rolling desktop prerelease (desktop-latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-latest"
          echo "Publishing rolling release $TAG..."
          mkdir -p dist-all
          cp dist-release/linux/* dist-all/ 2>/dev/null || true
          cp dist-release/windows/* dist-all/ 2>/dev/null || true

          NOTES="Latest rolling desktop builds (Windows + Linux) from commit ${{ github.sha }}."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" --prerelease --title "Desktop Latest (Rolling Build)" --notes "$NOTES"
            gh release upload "$TAG" dist-all/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" dist-all/* \
              --prerelease \
              --title "Desktop Latest (Rolling Build)" \
              --notes "$NOTES"
          fi
