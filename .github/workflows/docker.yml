name: Build & Publish Server Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'client/**'
      - 'Dockerfile'
      - 'scripts/fetch_crypto.sh'
      - '.github/workflows/docker.yml'
  workflow_run:
    workflows: ["Build & Release Crypto"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Crypto workflow did not succeed (${{ github.event.workflow_run.conclusion }}). Skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Triggered by successful crypto release."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Checkout for diff check
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check changed files on push
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^rust/penik-crypto/'; then
              echo "Push touches rust/penik-crypto. Crypto workflow is running and will trigger Docker build on completion. Skipping duplicate push build."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Push does not touch rust/penik-crypto. Proceeding with immediate Docker build."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Docker Image
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/penik-server
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/master') || (github.event.workflow_run.head_branch == 'master') }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_REPO=${{ github.repository }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    if: (github.ref == 'refs/heads/master') || (github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_WORKDIR || '/opt/penik' }}
            git pull
            docker compose pull
            docker compose up -d
