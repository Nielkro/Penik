name: Build & Publish Server Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'client/**'
      - 'Dockerfile'
      - 'scripts/fetch_crypto.sh'
      - '.github/workflows/docker.yml'
  workflow_run:
    workflows: ["Build & Release Crypto"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check Trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Crypto workflow did not succeed (${{ github.event.workflow_run.conclusion }}). Skipping."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Triggered by successful crypto release."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Checkout for diff check
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check changed files on push
        if: github.event_name == 'push'
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            if git diff --name-only HEAD~1 HEAD | grep -q '^rust/penik-crypto/'; then
              echo "Push touches rust/penik-crypto. Crypto workflow is running and will trigger Docker build on completion. Skipping duplicate push build."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Push does not touch rust/penik-crypto. Proceeding with immediate Docker build."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Docker Image
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/penik-server
          tags: |
            type=raw,value=latest,enable=${{ (github.ref == 'refs/heads/master') || (github.event.workflow_run.head_branch == 'master') }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_REPO=${{ github.repository }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-push
    if: (github.ref == 'refs/heads/master') || (github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: TARGET_SHA
          script: |
            cd ${{ secrets.SERVER_WORKDIR || '/opt/penik' }}
            git pull

            TARGET_TAG="sha-${TARGET_SHA:0:7}"
            if [ -z "$TARGET_SHA" ]; then
              TARGET_TAG="latest"
            fi

            PREV_TAG=$(cat .current_version 2>/dev/null || echo "")

            echo "Deploying target tag: $TARGET_TAG (previous version: ${PREV_TAG:-none})"

            PENIK_IMAGE_TAG="$TARGET_TAG" docker compose pull penik-server
            PENIK_IMAGE_TAG="$TARGET_TAG" docker compose up -d penik-server

            echo "Verifying server readiness..."
            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -s -f --max-time 2 http://127.0.0.1:8143/api/v1/health >/dev/null; then
                echo "Server is ready! (verified on attempt $i)"
                HEALTHY=1
                break
              fi
              echo "Waiting for server to become ready... (attempt $i/15)"
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Healthcheck failed for $TARGET_TAG! Container logs:"
              docker compose logs --tail=50 penik-server
              if [ -n "$PREV_TAG" ]; then
                echo "⚠️ Rolling back to previous healthy version: $PREV_TAG"
                PENIK_IMAGE_TAG="$PREV_TAG" docker compose pull penik-server || true
                PENIK_IMAGE_TAG="$PREV_TAG" docker compose up -d penik-server
                echo "Rolled back to $PREV_TAG"
              else
                echo "⚠️ No previous version in .current_version to roll back to."
              fi
              exit 1
            fi

            # Record successful version on server
            echo "$TARGET_TAG" > .current_version
            echo "🚀 Deployment of $TARGET_TAG successfully verified and recorded."
