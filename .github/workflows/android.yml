name: Build Android Debug APK

on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'version.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Google Services config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set in repository settings."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: penik-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android immutable version release
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(jq -r '.latest_android_version_name' version.json)
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "null" ]; then
            echo "Error: latest_android_version_name not found in version.json"
            exit 1
          fi
          TAG="android-v${VERSION_NAME}"
          echo "Target immutable release tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists and is immutable. Skipping upload to preserve release integrity."
          else
            echo "Creating new immutable release $TAG..."
            gh release create "$TAG" \
              --title "Android Release v${VERSION_NAME}" \
              --notes "Android build for version v${VERSION_NAME} (commit ${{ github.sha }})." \
              android/app/build/outputs/apk/debug/app-debug.apk
            echo "Release $TAG published successfully."
          fi
