name: Build Android Debug APK

on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'version.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      force_overwrite_version_release:
        description: 'Force overwrite/re-upload immutable version release (e.g. android-v1.0.4)'
        type: boolean
        default: false
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-debug:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Google Services config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set in repository settings."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: penik-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate APK SHA256 Checksum
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          cat android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publish Android rolling prerelease (android-latest)
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-latest"
          SHA256=$(awk '{print $1}' android/app/build/outputs/apk/debug/app-debug.apk.sha256)
          echo "Publishing rolling release $TAG with sha256: $SHA256..."

          NOTES=$(printf "Latest rolling build from commit %s (%s).\n\n**SHA-256 Checksum:**\n\`\`\`\n%s  app-debug.apk\n\`\`\`\n" "${{ github.sha }}" "${{ github.ref_name }}" "$SHA256")

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release edit "$TAG" \
              --prerelease \
              --title "Android Latest (Rolling Build)" \
              --notes "$NOTES"
            gh release upload "$TAG" \
              android/app/build/outputs/apk/debug/app-debug.apk \
              android/app/build/outputs/apk/debug/app-debug.apk.sha256 \
              --clobber
          else
            echo "Creating new rolling release $TAG..."
            gh release create "$TAG" \
              --prerelease \
              --title "Android Latest (Rolling Build)" \
              --notes "$NOTES" \
              android/app/build/outputs/apk/debug/app-debug.apk \
              android/app/build/outputs/apk/debug/app-debug.apk.sha256
          fi

      - name: Publish Android immutable version release
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite_version_release || github.event.inputs.force_overwrite_version_release || 'false' }}
        run: |
          VERSION_NAME=$(jq -r '.latest_android_version_name' version.json)
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "null" ]; then
            echo "Error: latest_android_version_name not found in version.json"
            exit 1
          fi
          TAG="android-v${VERSION_NAME}"
          SHA256=$(awk '{print $1}' android/app/build/outputs/apk/debug/app-debug.apk.sha256)
          echo "Target immutable release tag: $TAG (force overwrite: $FORCE_OVERWRITE)"

          RELEASE_NOTES=$(jq -r '.release_notes // empty' version.json)
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Android release v${VERSION_NAME} (commit ${{ github.sha }})."
          fi
          NOTES=$(printf "%s\n\n**SHA-256 Checksum:**\n\`\`\`\n%s  app-debug.apk\n\`\`\`\n" "$RELEASE_NOTES" "$SHA256")

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$FORCE_OVERWRITE" = "true" ]; then
              echo "Force overwrite requested. Updating existing release $TAG..."
              gh release edit "$TAG" \
                --title "Android Release v${VERSION_NAME}" \
                --notes "$NOTES"
              gh release upload "$TAG" \
                android/app/build/outputs/apk/debug/app-debug.apk \
                android/app/build/outputs/apk/debug/app-debug.apk.sha256 \
                --clobber
              echo "Release $TAG forcibly updated successfully."
            else
              echo "Release $TAG already exists and is immutable. Skipping upload to preserve release integrity."
            fi
          else
            echo "Creating new immutable release $TAG..."
            gh release create "$TAG" \
              --title "Android Release v${VERSION_NAME}" \
              --notes "$NOTES" \
              android/app/build/outputs/apk/debug/app-debug.apk \
              android/app/build/outputs/apk/debug/app-debug.apk.sha256
            echo "Release $TAG published successfully."
          fi
